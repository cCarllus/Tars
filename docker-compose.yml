services:
  bot:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/bot/database/tars.sqlite3
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./bot/database:/app/bot/database
    restart: unless-stopped
    command: ["python", "-m", "bot.main"]

  dashboard:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/bot/database/tars.sqlite3
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./bot/database:/app/bot/database
    ports:
      - "5050:5000"
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "flask",
        "--app",
        "dashboard.app:app",
        "run",
        "--host=0.0.0.0",
        "--port=5000",
      ]
